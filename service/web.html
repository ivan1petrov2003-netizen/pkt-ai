<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<title>pkt-ai — чат с нейросетью</title>
<style>
:root{--bg:#0f1420;--card:#1a2130;--tx:#e8ecf3;--mut:#93a0b4;--ac:#4aa3ef;--ok:#4cc38a;--er:#ff7b72;--bd:#2a3345}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:baseline}
header h1{font-size:1.2rem;margin:0}header h1 span{color:var(--ac)}
header .st{color:var(--mut);font-size:.85rem}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;border-radius:14px;padding:12px 16px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#1f3a5f}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.msg.bot.ok{border-color:var(--ok)}
.msg.bot.err{border-color:var(--er)}
.msg .log{color:var(--mut);font-size:.85rem;margin:6px 0 0;padding-left:14px}
.msg img{max-width:100%;border-radius:8px;margin:4px 0}
.dl{display:inline-block;margin-top:8px;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:600 .95rem "Segoe UI",sans-serif;cursor:pointer}
footer{border-top:1px solid var(--bd);padding:12px 20px;background:var(--card)}
#files{color:var(--mut);font-size:.85rem;margin:4px 0 6px;min-height:18px}
.row{display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;background:#111725;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font:inherit;resize:none;height:64px}
button.send{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:600 1rem "Segoe UI",sans-serif;cursor:pointer}
button.send:disabled{opacity:.5;cursor:wait}
button.att{background:transparent;color:var(--mut);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:1.1rem}
.hint{color:var(--mut);font-size:.8rem;margin-top:6px}
</style></head><body>
<header><h1>pkt<span>-ai</span></h1><span class="st">текст задания (+ фото схемы / методичка) → готовый .pkt</span></header>
<div id="chat"></div>
<footer>
  <div id="files"></div>
  <div class="row">
    <button class="att" title="Прикрепить фото схемы или методичку">📎</button>
    <textarea id="task" placeholder="Опишите задание: например «Соберите сеть: PC1 и PC2 через свитч 2960 к роутеру 2911, сеть 192.168.50.0/24, роутер 192.168.50.1, ПК .10 и .11»"></textarea>
    <button class="send" id="go">Собрать</button>
  </div>
  <div class="hint">📎 можно прикрепить: .txt/.md методички (работают всегда) и фото схемы — последнее только если модель умеет читать картинки (иначе система автоматически повторит без фото). Первый пинг в PT может терять 1–2 пакета (ARP) — это норма.</div>
  <input type="file" id="fpick" multiple hidden accept="image/*,.txt,.md,.json">
</footer>
<script>
const chat = document.getElementById('chat');
const taskEl = document.getElementById('task');
const filesEl = document.getElementById('files');
const fpick = document.getElementById('fpick');
const go = document.getElementById('go');
let pending = [];  // {name, dataUrl?, text?}

document.querySelector('.att').onclick = () => fpick.click();
fpick.onchange = () => {
  for (const f of fpick.files) pending.push({file: f, name: f.name});
  renderFiles(); fpick.value = '';
};
function renderFiles(){
  filesEl.textContent = pending.length ? '📎 прикреплено: ' + pending.map(p=>p.name).join(', ') : '';
}
async function fileToParts(f){
  if (/\.(txt|md|json)$/i.test(f.name)) {
    const t = await f.text();
    return {text: '\n\n--- Вложение ' + f.name + ' ---\n' + t};
  }
  const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
  return {image: dataUrl};
}
function add(kind, html){
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.innerHTML = html;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
go.onclick = async () => {
  const task = taskEl.value.trim();
  if (!task) return;
  go.disabled = true;
  add('user', task.replace(/</g,'&lt;') + (pending.length ? '<br><small>📎 ' + pending.map(p=>p.name).join(', ') + '</small>' : ''));
  const wait = add('bot', '⏳ Нейросеть собирает лабу… обычно 30–180 секунд, не закрывайте страницу.');
  taskEl.value = '';
  let images = [], texts = [];
  for (const p of pending) {
    const parts = await fileToParts(p.file);
    if (parts.image) images.push(parts.image); else if (parts.text) texts.push(parts.text);
  }
  pending = []; renderFiles();
  const fullTask = task + texts.join('');
  try {
    const r = await fetch('/api/v1/labs', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({task: fullTask, images})
    });
    const j = await r.json();
    chat.removeChild(wait);
    if (j.ok) {
      const d = add('bot ok',
        '✅ <b>Лаба собрана и проверена!</b> Устройств: ' + j.ir.devices.length +
        ', линков: ' + j.ir.links.length +
        ' (итераций: ' + j.iterations + ')' +
        '<br><span class="log">' + j.log.map(l=>l.replace(/</g,'&lt;')).join('<br>') + '</span>');
      const b = document.createElement('button');
      b.className = 'dl'; b.textContent = '⬇ Скачать ' + j.file.split('\\').pop();
      b.onclick = () => {
        const bin = atob(j.pkt_b64), arr = new Uint8Array(bin.length);
        for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([arr]));
        a.download = j.file.split('\\').pop(); a.click();
      };
      d.appendChild(document.createElement('br')); d.appendChild(b);
    } else {
      add('bot err', '❌ <b>Не получилось:</b> ' + (j.error || 'см. журнал') +
        '<br><span class="log">' + (j.log||[]).map(l=>l.replace(/</g,'&lt;')).join('<br>') + '</span>');
    }
  } catch (e) {
    chat.removeChild(wait);
    add('bot err', '❌ Сервер недоступен: ' + e.message + '<br><span class="log">Запустите ЗАПУСК.bat в папке проекта</span>');
  }
  go.disabled = false;
};
taskEl.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); go.click(); } });
fetch('/health').then(r=>r.json()).then(j=>{ if(j.ok) add('bot','👋 Привет! Опишите задание — соберу лабу для Packet Tracer и отдам .pkt. Можно прикрепить фото схемы или методичку.'); })
.catch(()=> add('bot err','Сервер не отвечает. Запустите ЗАПУСК.bat в папке pkt-ai.'));
</script>
</body></html>
